# Three AVC representations and AAC at two bitrates (one Adaptation Set),
# 2 s segments with $Number$.
name: ladder_2s
duration: 120             # seconds; override with -duration
segmentDuration: 2
video:
  fps: 25
  representations:
    - {id: V400, codec: avc, width: 640, height: 360, bitrate: 400}
    - {id: V800, codec: avc, width: 960, height: 540, bitrate: 800}
    - {id: V1600, codec: avc, width: 1280, height: 720, bitrate: 1600}
audio:
  representations:
    - {id: A64, codec: aac, bitrate: 64, signal: beep, lang: en}
    - {id: A128, codec: aac, bitrate: 128, signal: beep, lang: en}

# AVC and HEVC with B-frames. The composition time offsets are shifted so
# that the first picture of every segment has offset 0, and the B-frames get
# negative offsets (trun version 1), so the presentation starts at 0 without
# an edit list. Audio keeps its encoder priming, signalled with an edit list.
name: bframes_2s
duration: 120
segmentDuration: 2
addressing: timeline-time
video:
  fps: 30
  bframes: 3
  representations:
    - {id: Vavc, codec: avc, width: 1280, height: 720, bitrate: 1500}
    - {id: Vhevc, codec: hevc, width: 1280, height: 720, bitrate: 1000}
audio:
  priming: elst
  representations:
    - {id: Aaac, codec: aac, bitrate: 128, lang: en}
